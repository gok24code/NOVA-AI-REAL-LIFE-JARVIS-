<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>N.O.V.A.</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0d0e;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid rgba(94, 234, 212, 0.15);
    border-top-color: #5eead4;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .title {
    color: #5eead4;
    font-size: 15px;
    letter-spacing: 4px;
    font-weight: 600;
  }
  .status {
    color: #7fa3a0;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="title">N.O.V.A.</div>
  <div class="status">Başlatılıyor, lütfen bekleyin...</div>
</body>
</html>
